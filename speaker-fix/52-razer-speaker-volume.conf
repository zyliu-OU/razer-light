# Volume curve for the Razer Blade 16 internal speakers.
#
# The speaker amplifier mutes any signal below about -40 dBFS. With the normal
# PipeWire volume curve the bottom half of the slider falls under that level, so
# it is silent, and everything audible is squeezed into the top half.
#
# This rule takes volume control away from the hardware "Speaker" control and
# does it in the filter graph instead, in three straight-line (in dB) pieces:
#   slider   0%        = silent (true silence, gain 0; mute also lands here)
#   slider   1% ..  20% = -30 dB .. -20 dB  (fine steps at the quiet end)
#   slider  20% .. 100% = -20 dB ..   0 dB  (2.5 dB per 10%; same maximum)
#   e.g. 10% = -25.3 dB, 50% = -12.5 dB, 80% = -5 dB.
# The hardware "Speaker" and "Headphone" controls must sit at 0 dB
# (razer_speaker_fix.py sets them). Headphones and HDMI keep the normal curve,
# in software.
#
# How the graph computes it (s = slider 0..1, E = gain in dB / 20):
#   E = -2.276316 + 50 * clamp(s, 0, 0.01)        (nodes ca, x5, la)
#                 + 2.631579 * clamp(s, 0.01, 0.2) (nodes cb, lb)
#                 + 1.25 * clamp(s, 0.2, 1.0)      (nodes cc, lc)
#   gain = 10 ^ E                                  (node pow)
# Each piece's Mult = (its dB rise / 20) / (its slider width). A linear node's
# Mult tops out at 10, hence x5 * la for the first piece's 50. The constant is
# chosen so E = -2.0 (-40 dB) at s = 0.
#
# Mute: with channelmix.lock-volumes, PipeWire does not apply mute itself; it
# sends slider 0 to the graph. So the graph adds a gate (nodes g1, g2, gc, gate):
#   gate gain = clamp(100 * s, 0, 1)   -> 0 at s = 0, fully open from s = 1%
# which makes 0% and mute truly silent instead of the curve's -40 dB floor.
# After editing, run: systemctl --user restart wireplumber
monitor.alsa.rules = [
  {
    # Card level: stop PipeWire from driving the hardware volume controls.
    # Other outputs on this card (headphones, HDMI) then use ordinary software
    # volume, which works the same from the user's side.
    matches = [
      { device.name = "~alsa_card.pci-0000_00_1f.3-platform-skl_hda_dsp_generic" }
    ]
    actions = {
      update-props = {
        api.alsa.soft-mixer = true
      }
    }
  }
  {
    matches = [
      { node.name = "~alsa_output.*HiFi__Speaker__sink" }
    ]
    actions = {
      update-props = {
        # The volume goes to the graph's "in" control instead of being applied
        # directly, so it is not applied twice.
        channelmix.lock-volumes = true
        audioconvert.filter-graph.1 = "{ nodes = [ { type = builtin name = in label = linear control = { Mult = 1.0 Add = 0.0 } } { type = builtin name = ca label = clamp control = { Min = 0.0 Max = 0.01 } } { type = builtin name = cb label = clamp control = { Min = 0.01 Max = 0.2 } } { type = builtin name = cc label = clamp control = { Min = 0.2 Max = 1.0 } } { type = builtin name = x5 label = linear control = { Mult = 5.0 Add = 0.0 } } { type = builtin name = la label = linear control = { Mult = 10.0 Add = -2.276316 } } { type = builtin name = lb label = linear control = { Mult = 2.631579 } } { type = builtin name = lc label = linear control = { Mult = 1.25 } } { type = builtin name = pow label = exp control = { Base = 10.0 } } { type = builtin name = vol label = linear control = { Add = 0.0 } } { type = builtin name = g1 label = linear control = { Mult = 10.0 Add = 0.0 } } { type = builtin name = g2 label = linear control = { Mult = 10.0 Add = 0.0 } } { type = builtin name = gc label = clamp control = { Min = 0.0 Max = 1.0 } } { type = builtin name = gate label = linear control = { Add = 0.0 } } ] links = [ { output = \"in:Notify\" input = \"ca:Control\" } { output = \"in:Notify\" input = \"cb:Control\" } { output = \"in:Notify\" input = \"cc:Control\" } { output = \"ca:Notify\" input = \"x5:Control\" } { output = \"x5:Notify\" input = \"la:Control\" } { output = \"cb:Notify\" input = \"lb:Control\" } { output = \"la:Notify\" input = \"lb:Add\" } { output = \"cc:Notify\" input = \"lc:Control\" } { output = \"lb:Notify\" input = \"lc:Add\" } { output = \"lc:Notify\" input = \"pow:Control\" } { output = \"pow:Notify\" input = \"vol:Mult\" } { output = \"in:Notify\" input = \"g1:Control\" } { output = \"g1:Notify\" input = \"g2:Control\" } { output = \"g2:Notify\" input = \"gc:Control\" } { output = \"gc:Notify\" input = \"gate:Mult\" } { output = \"vol:Out\" input = \"gate:In\" } ] inputs = [ \"vol:In\" ] outputs = [ \"gate:Out\" ] input.volumes = [ { control = \"in:Control\" min = 0.0 max = 1.0 scale = cubic } ] }"
      }
    }
  }
]

# Small script that pushes the saved volume into the graph when the speaker
# output first starts (see razer-speaker-volume-sync.lua).
wireplumber.components = [
  {
    name = razer-speaker-volume-sync.lua, type = script/lua
    provides = custom.razer-speaker-volume-sync
  }
]
wireplumber.profiles = {
  main = {
    custom.razer-speaker-volume-sync = required
  }
}
