# Volume curve for the Razer Blade 16 internal speakers.
#
# The speaker amplifier mutes any signal below about -40 dBFS. With the normal
# PipeWire volume curve the bottom half of the slider falls under that level, so
# it is silent, and everything audible is squeezed into the top half.
#
# This rule takes volume control away from the hardware "Speaker" control and
# does it in the filter graph instead, spread evenly in dB over the slider:
#   slider 0% = -20 dB ... slider 100% = 0 dB (same maximum as before)
#   i.e. 2 dB per 10% of slider: 20% = -16 dB, 50% = -10 dB, 80% = -4 dB.
#   0% is not silent; use mute for silence.
# The hardware "Speaker" and "Headphone" controls must sit at 0 dB
# (razer_speaker_fix.py sets them). Headphones and HDMI keep the normal curve,
# in software.
#
# To change the range, edit Mult and Add in the "db" node:
#   gain at slider s = 10 ^ (Add + Mult * s)    (Add = min dB / 20, Mult = -Add)
#   -20 dB: Mult = 1.0 Add = -1.0     -10 dB: Mult = 0.5 Add = -0.5
# then run: systemctl --user restart wireplumber
monitor.alsa.rules = [
  {
    # Card level: stop PipeWire from driving the hardware volume controls.
    # Other outputs on this card (headphones, HDMI) then use ordinary software
    # volume, which works the same from the user's side.
    matches = [
      { device.name = "~alsa_card.pci-0000_00_1f.3-platform-skl_hda_dsp_generic" }
    ]
    actions = {
      update-props = {
        api.alsa.soft-mixer = true
      }
    }
  }
  {
    matches = [
      { node.name = "~alsa_output.*HiFi__Speaker__sink" }
    ]
    actions = {
      update-props = {
        # The volume goes to the graph's "db" control instead of being applied
        # directly, so it is not applied twice.
        channelmix.lock-volumes = true
        audioconvert.filter-graph.1 = "{ nodes = [ { type = builtin name = db label = linear control = { Mult = 1.0 Add = -1.0 } } { type = builtin name = pow label = exp control = { Base = 10.0 } } { type = builtin name = vol label = linear control = { Add = 0.0 } } ] links = [ { output = \"db:Notify\" input = \"pow:Control\" } { output = \"pow:Notify\" input = \"vol:Mult\" } ] inputs = [ \"vol:In\" ] outputs = [ \"vol:Out\" ] input.volumes = [ { control = \"db:Control\" min = 0.0 max = 1.0 scale = cubic } ] }"
      }
    }
  }
]

# Small script that pushes the saved volume into the graph when the speaker
# output first starts (see razer-speaker-volume-sync.lua).
wireplumber.components = [
  {
    name = razer-speaker-volume-sync.lua, type = script/lua
    provides = custom.razer-speaker-volume-sync
  }
]
wireplumber.profiles = {
  main = {
    custom.razer-speaker-volume-sync = required
  }
}
