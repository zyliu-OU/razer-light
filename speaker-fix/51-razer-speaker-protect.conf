# Speaker protection for the Razer Blade 16 internal speakers.
#
# Adds a filter inside the PipeWire speaker output only (headphones, HDMI and
# Bluetooth are separate outputs and are not touched):
#   - 4th-order high-pass at 80 Hz: removes bass the speakers cannot reproduce
#     but that still drives the cones
#   - -3 dB gain (Mult = 0.708): lowers the maximum power and leaves headroom
#     so the high-pass cannot push peaks into clipping
#
# To tune, change Freq (both stages) or Mult, then run:
#   systemctl --user restart wireplumber
monitor.alsa.rules = [
  {
    matches = [
      { node.name = "~alsa_output.*HiFi__Speaker__sink" }
    ]
    actions = {
      update-props = {
        audioconvert.filter-graph.0 = "{ nodes = [ { type = builtin name = hp1 label = bq_highpass control = { Freq = 80.0 Q = 0.54 } } { type = builtin name = hp2 label = bq_highpass control = { Freq = 80.0 Q = 1.31 } } { type = builtin name = gain label = linear control = { Mult = 0.708 Add = 0.0 } } ] links = [ { output = \"hp1:Out\" input = \"hp2:In\" } { output = \"hp2:Out\" input = \"gain:In\" } ] inputs = [ \"hp1:In\" ] outputs = [ \"gain:Out\" ] }"
      }
    }
  }
]
